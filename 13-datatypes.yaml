- name: data types in yaml
  hosts: local
  connection: local
  vars:
    firstname: vardhan
    myweight: 75
    is_male: true
    skills:
      - Linux
      - AWS
      - Shell Script
      - Ansible
    my_details:
      father: Gopala Krishna
      mother: Sarada
    exact_weight: 75.6
    tasks:
      debug:
        msg: |
          firstname : {{ firstname | type_debug }}
          myweight : {{ myweight | type_debug }}
          male : {{ is_male | type_debug }}
          skills : {{ skills | type_debug }}
          my_details : {{ my_details | type_debug }}
          exact_weight : {{ exact_weight | type_debug }}
