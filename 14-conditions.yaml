- name: Conditions
  hosts: local
  connection: local
  vars:
    given_number: 20
  tasks:
    - name: Print if even
      debug:
        msg: "Given number {{ given_number }} is even"
      when: given_number % 2 == 0

    - name: print if odd
      debug:
        msg: "Given number {{ given_number }} is odd"
      when: given_number % 2 != 0
