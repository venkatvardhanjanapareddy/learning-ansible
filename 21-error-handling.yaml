- name: create error
  hosts: local
  connection: local
  become: yes
  tasks:
    - name: check if user exixts or not
      command: id roboshop
      register: user_id
      ignore_errors: true
    - name: print the o/p
      debug:
        msg: "{{ user_id }}"
    - name: create user
      command: useradd roboshop
      when: user_id.rc != 0 # creating user only when the user isnlt exist. rc returns 1 if the user is not there.
