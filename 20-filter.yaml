- name: using split and join filter
  hosts: local
  connection: local
  vars:
    topics: Linux, Shell, Ansible, Terraform
    full_name:
      - Venkat
      - Vardhan
      - Janapareddy
  tasks:
    - name: Using split
      debug:
        msg: "{{ topics | split(', ')}}"
    - name: using join
      debug:
        msg: "My full name is {{ full_name | join(' ') }}"

  # "{{ topics | split(', ')}}" if we use text then list isn't working, need to store in another variable and then use it with the text to print as list.  List and text are 2 different things to print.
